[package]
name = "p2p-vpn-android-e2e-fixture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Unprivileged Linux endpoint for p2p-vpn Android end-to-end tests"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
p2p-vpn = { path = "../.." }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
