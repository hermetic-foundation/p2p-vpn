plugins {
    id "com.android.application"
}

def sdkAarPath = providers.environmentVariable("P2P_VPN_ANDROID_AAR").orNull
if (!sdkAarPath || !file(sdkAarPath).isFile()) {
    throw new GradleException("Set P2P_VPN_ANDROID_AAR to the SDK's libp2p-vpn-android.aar file.")
}

android {
    namespace = "org.hermeticfoundation.p2pvpn"
    compileSdk = 37
    buildToolsVersion = "37.0.0"

    defaultConfig {
        applicationId = "org.hermeticfoundation.p2pvpn"
        minSdk = 29
        targetSdk = 37
        versionCode = 1
        versionName = "0.1.0"
        testInstrumentationRunner = "org.hermeticfoundation.p2pvpn.ServiceLifecycleInstrumentation"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = false
    }

    signingConfigs {
        // Public development key for reproducible debug APKs. Never use it for a release build.
        debug {
            storeFile = file("p2p-vpn-debug.keystore")
            storePassword = "android"
            keyAlias = "p2p-vpn-debug"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            signingConfig = signingConfigs.debug
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation files(sdkAarPath)
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
