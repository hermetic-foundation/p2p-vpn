[package]
name = "p2p-vpn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust foundation for a libp2p-native packet-oriented mesh VPN"
publish = false
autolib = false
autotests = false

[workspace]
resolver = "3"

[[bin]]
name = "p2p-vpn"
path = "src/main.rs"

[[test]]
name = "pair_cli"
path = "tests/pair_cli.rs"

[[test]]
name = "tun_namespace"
path = "tests/tun_namespace.rs"

[[test]]
name = "windows_platform"
path = "tests/windows_platform.rs"

[[test]]
name = "resource_measurement"
path = "tests/resource_measurement.rs"

[features]
webrtc = ["p2p_vpn/webrtc"]
allocation-review = ["p2p_vpn/allocation-review"]
allocation-sizes = ["allocation-review", "p2p_vpn/allocation-sizes", "stats_alloc/size-inventory"]
battery-diagnostics = ["p2p_vpn/battery-diagnostics"]
demand-lifecycle-trial = ["p2p_vpn/demand-lifecycle-trial"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.0"
futures = "0.3.33"
libp2p = { git = "https://github.com/hermetic-foundation/libp2p-vpn.git", rev = "13464c4dce39f58d51ab38b87a93cb688e958154", features = ["kad", "mdns", "relay", "request-response"] }
p2p_vpn = { package = "libp2p-vpn", git = "https://github.com/hermetic-foundation/libp2p-vpn.git", rev = "13464c4dce39f58d51ab38b87a93cb688e958154" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
hickory-proto = "0.25.2"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
stats_alloc = { version = "=0.1.10", git = "https://github.com/hermetic-foundation/libp2p-vpn.git", rev = "13464c4dce39f58d51ab38b87a93cb688e958154" }
