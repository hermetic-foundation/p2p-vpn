[package]
name = "p2p-vpn"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust foundation for a libp2p-native packet-oriented mesh VPN"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tun = "0.8.14"
